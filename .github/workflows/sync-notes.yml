name: Sync published notes

# Phase 2 of https://github.com/mohokoto/mohokoto.github.io/issues/3
#
# Pulls notes/ from the public notes-published repo and mirrors it into
# this repo's notes/ directory only. Never touches any other path —
# this is a code-level safeguard (see issue #3's blast-radius
# discussion), not a permission-level one, since GitHub Actions
# permissions cannot be scoped to a path.
#
# Uses actions/checkout (git clone) rather than the REST API to read
# notes-published, so this is not subject to the unauthenticated REST
# API rate limit (60/hour) that was a concern during design — that
# limit applies to api.github.com calls, not git protocol operations.

on:
  workflow_dispatch: {}
  schedule:
    # Re-touched 2026-08-11 09:41 UTC — schedule wasn't firing after ~45min,
    # trying a re-commit to nudge GitHub into re-registering the trigger.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mohokoto.github.io
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: site

      - name: Checkout notes-published
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: mohokoto/notes-published
          path: notes-published

      - name: Sync notes/ directory only
        run: |
          set -euo pipefail
          mkdir -p notes-published/notes
          mkdir -p site/notes
          rsync -a --delete notes-published/notes/ site/notes/

      - name: Commit and push if changed
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Sync published notes from notes-published"
          git push
